<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM with Chai Aur Code</title>
</head>
<body style="background-color: #212121; color: #f1f1f1"> 

    <!-- ul.language => Ise likhne pe ul create ho jayegi with class language  -->

    <ul class="language">
        <li>
            Java Script 
        </li>
    </ul>

    <script>

        // Yaha pura traverse karna pad raha hai 

        function AddLanguage(langName){
            const li = document.createElement('li');
                li.innerHTML = `${langName}`
                document.querySelector('.language').appendChild(li)
        }
        AddLanguage("Python")
        AddLanguage("TypeScript")

        // +++++ Ab opitmised method +++++ 

        function addOpLanguage(langName){
            const li = document.createElement('li');
            li.appendChild(document.createTextNode(langName))
            document.querySelector('.language').appendChild(li)
        }
        addOpLanguage("Cpp")

        // +++++ Edit +++++ 

        const secondLang = document.querySelector("li:nth-child(2)")
        const newli = document.createElement('li')
        newli.textContent = "Mojo" 

        secondLang.replaceWith(newli)

        // +++++ Edit ++++++ 

        const firstLang = document.querySelector("li:first-child")
        firstLang.outerHTML = '<li>TypeScript</li>'

        // +++++++ Remove ++++++ 

        const lastLang = document.querySelector('li:last-child')
        lastLang.remove()
        

    </script>

</body>
</html>
